# Kontinuierliche Qualitätssicherung: Lint, Format, Typecheck, Tests, Build
# und Dependency-Audit laufen bei jedem Push auf main und bei jedem PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (editor + app)
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium firefox

      - name: E2E-Smoke-Tests (gegen den Prod-Build)
        run: npm run test:e2e --workspace=packages/app

      - name: Playwright-Report bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7

      - name: Dependency-Audit (production)
        run: npm audit --omit=dev --audit-level=high

  ofm-dogfooding:
    # Produzenten-Konformität (AUFTRAG 2.4, DoD 1+3): der Referenz-Validator
    # aus ofm-spec muss das grüne Demo-Fixture als KONFORM Klasse A
    # akzeptieren und das absichtlich fehlerhafte Fixture wegen OFM-R-320
    # zurückweisen. Setzt voraus, dass ofm-spec unter demselben Account
    # veröffentlicht ist (siehe OPEN-CODE-CHECKLISTE.md, AUFTRAG 2.2).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: jsonforms-designer

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/ofm-spec
          path: ofm-spec

      - uses: actions/setup-node@v6
        with:
          node-version-file: jsonforms-designer/.nvmrc
          cache: npm
          cache-dependency-path: ofm-spec/package-lock.json

      - name: ofm-validate installieren
        run: npm ci
        working-directory: ofm-spec

      - name: Demo-Fixture "bewohnerparkausweis" muss KONFORM Klasse A sein
        run: node ../ofm-spec/bin/ofm-validate.js demo/bewohnerparkausweis --class A
        working-directory: jsonforms-designer

      - name: Demo-Fixture "demo-fehler" muss wegen OFM-R-320 zurückgewiesen werden
        run: |
          if node ../ofm-spec/bin/ofm-validate.js demo/demo-fehler; then
            echo "demo-fehler wurde fälschlich als konform akzeptiert." >&2
            exit 1
          fi
        working-directory: jsonforms-designer
